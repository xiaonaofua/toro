<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>闯关东</title>
    <meta name="description" content="文字分支叙事小游戏：清末，一个山东人闯关东的十二年。">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #efe5cf;
            --paper-edge: #d9caa6;
            --ink: #2a2118;
            --ink-soft: #5c4d3c;
            --ink-faint: #8a7a64;
            --seal: #a8321f;
            --gold: #c8964a;
            --serif: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "STSong", "SimSun", serif;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #14100c;
            color: var(--ink);
            font-family: var(--serif);
            -webkit-tap-highlight-color: transparent;
        }

        button { font-family: inherit; }

        /* ── 背景 ── */
        .bg {
            position: fixed;
            inset: 0;
            transition: opacity 1.6s ease;
        }
        #bgB { opacity: 0; }
        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
        }
        .ridge {
            position: fixed;
            left: 0; bottom: 0;
            width: 100%;
            height: 34vh;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 1.6s ease;
        }

        /* ── 顶栏 ── */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
            color: #f3e8d2;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            z-index: 5;
        }
        #hud .place { flex: 1; min-width: 0; }
        #hud .chapter { font-weight: 600; font-size: 15px; letter-spacing: 0.08em; }
        #hud .when {
            font-size: 12px;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stats { display: flex; gap: 14px; font-size: 13px; align-items: center; }
        .stat { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 3px; height: 34px; }
        .stat .k { font-size: 11px; opacity: 0.75; letter-spacing: 0.1em; }
        .stat .v { font-weight: 600; }
        .bar { display: flex; gap: 2px; }
        .bar i {
            width: 5px; height: 10px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 1px;
        }
        .bar i.on { background: #e9b56a; }
        .bar.low i.on { background: #e0553c; }
        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.25);
            color: #f3e8d2;
            font-size: 16px;
            cursor: pointer;
            flex: none;
        }

        /* ── 纸面 ── */
        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: calc(70px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
            z-index: 2;
        }
        .paper {
            position: relative;
            width: 100%;
            max-width: 720px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, 0.35), transparent 60%),
                radial-gradient(ellipse at 100% 100%, rgba(150, 110, 60, 0.18), transparent 55%),
                var(--paper);
            border-radius: 4px;
            box-shadow:
                0 0 0 1px var(--paper-edge) inset,
                0 20px 60px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .paper.show { opacity: 1; transform: none; }
        .scroll {
            overflow-y: auto;
            padding: 28px 30px 8px;
            -webkit-overflow-scrolling: touch;
            cursor: pointer;
        }
        #text p {
            margin: 0 0 1em;
            font-size: 17px;
            line-height: 1.95;
            letter-spacing: 0.02em;
            text-align: justify;
        }
        #text p.cur::after {
            content: "▌";
            color: var(--seal);
            animation: blink 1s steps(2) infinite;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .hint {
            text-align: center;
            font-size: 12px;
            color: var(--ink-faint);
            padding: 0 0 12px;
            letter-spacing: 0.15em;
        }

        #choices {
            padding: 4px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .choice {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(90, 70, 40, 0.28);
            border-radius: 3px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(6px);
            animation: rise 0.4s ease forwards;
            transition: background 0.2s, border-color 0.2s;
        }
        .choice:hover:not(:disabled), .choice:focus-visible {
            background: rgba(168, 50, 31, 0.08);
            border-color: var(--seal);
            outline: none;
        }
        .choice .num {
            flex: none;
            width: 22px; height: 22px;
            margin-top: 2px;
            border-radius: 50%;
            background: var(--seal);
            color: #f6ead7;
            font-size: 12px;
            display: grid;
            place-items: center;
        }
        .choice:disabled { cursor: not-allowed; opacity: 0.45 !important; }
        .choice .why { font-size: 12px; color: var(--seal); margin-left: 6px; }
        @keyframes rise { to { opacity: 1; transform: none; } }

        /* ── 章节印章 ── */
        .seal {
            display: inline-block;
            padding: 4px 8px;
            border: 2px solid var(--seal);
            color: var(--seal);
            font-weight: 900;
            letter-spacing: 0.15em;
            border-radius: 3px;
            transform: rotate(-3deg);
        }
        .chapter-head {
            margin: 0 0 18px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .chapter-head small { color: var(--ink-faint); font-size: 13px; }

        /* ── 提示条 ── */
        #toast {
            position: fixed;
            left: 50%;
            top: calc(72px + env(safe-area-inset-top));
            transform: translate(-50%, -8px);
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(20, 14, 10, 0.82);
            color: #f3e8d2;
            font-size: 13px;
            letter-spacing: 0.05em;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 8;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #toast .up { color: #9fd38a; }
        #toast .down { color: #f08a72; }

        /* ── 覆盖层 ── */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(10, 8, 6, 0.7);
        }
        .overlay.show { display: flex; }
        .card {
            width: 100%;
            max-width: 460px;
            max-height: 100%;
            overflow-y: auto;
            background: var(--paper);
            border-radius: 4px;
            padding: 26px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .card h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: 0.15em; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0 0;
            font-size: 16px;
            letter-spacing: 0.2em;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(90, 70, 40, 0.35);
            border-radius: 3px;
            cursor: pointer;
        }
        .btn:hover { border-color: var(--seal); color: var(--seal); }
        .btn.primary { background: var(--seal); color: #f6ead7; border-color: var(--seal); }
        .btn.primary:hover { color: #fff; background: #8f2717; }
        .speed { display: flex; gap: 6px; margin: 6px 0 14px; }
        .speed button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid rgba(90, 70, 40, 0.35);
            background: transparent;
            border-radius: 3px;
            cursor: pointer;
            color: var(--ink);
        }
        .speed button.on { background: var(--ink); color: var(--paper); }
        .label { font-size: 13px; color: var(--ink-soft); }

        /* 标题页 */
        #title { background: transparent; flex-direction: column; text-align: center; }
        #title .logo {
            writing-mode: vertical-rl;
            font-size: clamp(56px, 14vw, 96px);
            font-weight: 900;
            letter-spacing: 0.2em;
            color: #f3e8d2;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            margin: 0 auto;
            position: relative;
        }
        #title .logo .seal {
            position: absolute;
            left: -46px;
            bottom: 10px;
            writing-mode: vertical-rl;
            font-size: 14px;
            background: rgba(168, 50, 31, 0.9);
            color: #f6ead7;
            border-color: #f6ead7;
        }
        #title .sub {
            color: rgba(243, 232, 210, 0.82);
            margin: 22px 0 6px;
            letter-spacing: 0.25em;
            font-size: 15px;
        }
        #title .meta {
            color: rgba(243, 232, 210, 0.55);
            font-size: 12px;
            letter-spacing: 0.15em;
            margin-bottom: 26px;
        }
        #title .menu { width: 100%; max-width: 260px; margin: 0 auto; }
        #title .btn { color: #f3e8d2; background: rgba(0, 0, 0, 0.25); border-color: rgba(243, 232, 210, 0.35); }
        #title .btn.primary { background: var(--seal); border-color: var(--seal); }
        #title .btn:hover { border-color: #f3e8d2; }

        /* 结局图鉴 */
        .end-list { list-style: none; margin: 0 0 8px; padding: 0; }
        .end-list li {
            display: flex;
            gap: 12px;
            align-items: baseline;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(90, 70, 40, 0.25);
        }
        .end-list .no { color: var(--seal); font-weight: 900; width: 2em; flex: none; }
        .end-list .t { font-weight: 600; }
        .end-list .h { font-size: 13px; color: var(--ink-faint); }
        .end-list li.locked .t { color: var(--ink-faint); }

        /* 结局页 */
        .ending-head { text-align: center; margin: 4px 0 22px; }
        .ending-head .seal { font-size: 22px; padding: 6px 14px; }
        .ending-head .k { display: block; font-size: 12px; letter-spacing: 0.3em; color: var(--ink-faint); margin-bottom: 10px; }
        .afterword {
            font-size: 13px !important;
            color: var(--ink-soft);
            border-top: 1px solid rgba(90, 70, 40, 0.25);
            padding-top: 14px;
            line-height: 1.8 !important;
        }

        @media (max-width: 560px) {
            .scroll { padding: 22px 18px 6px; }
            #choices { padding: 4px 12px 14px; }
            #text p { font-size: 16px; line-height: 1.9; }
            .choice { font-size: 15px; }
            .stats { gap: 10px; }
            .bar i { width: 4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .paper, .choice, .bg { transition: none; animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <div class="bg" id="bgA"></div>
    <div class="bg" id="bgB"></div>
    <svg class="ridge" id="ridge" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path id="ridgeFar" d="M0 170 L90 120 L170 150 L260 90 L360 140 L450 100 L540 150 L640 80 L740 130 L840 95 L950 150 L1050 110 L1200 140 L1200 300 L0 300 Z" fill="rgba(0,0,0,0.25)"/>
        <path id="ridgeNear" d="M0 230 L120 200 L230 225 L350 185 L470 220 L600 195 L720 230 L850 200 L980 228 L1100 205 L1200 220 L1200 300 L0 300 Z" fill="rgba(0,0,0,0.45)"/>
    </svg>
    <canvas id="fx"></canvas>
    <div class="vignette"></div>

    <header id="hud" hidden>
        <div class="place">
            <div class="chapter" id="hudChapter"></div>
            <div class="when" id="hudWhen"></div>
        </div>
        <div class="stats">
            <div class="stat" title="盘缠：身上的银子"><span class="k">盘缠</span><span class="v" id="stMoney"></span></div>
            <div class="stat" title="体力：降到零，人就倒下了"><span class="k">体力</span><span class="bar" id="stHp"></span></div>
            <div class="stat" title="情义：别人怎么看你"><span class="k">情义</span><span class="v" id="stRep"></span></div>
        </div>
        <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
    </header>

    <main id="stage" hidden>
        <article class="paper" id="paper">
            <div class="scroll" id="scroll">
                <div id="text"></div>
                <div class="hint" id="hint">点击 / 空格 显示全部</div>
            </div>
            <div id="choices"></div>
        </article>
    </main>

    <div id="toast"></div>

    <section class="overlay show" id="title">
        <div class="logo">闯关东<span class="seal">光绪二十五年</span></div>
        <div class="sub">一个山东人的关东十二年</div>
        <div class="meta">文字冒险 · 一局约二十分钟 · 八个结局</div>
        <div class="menu">
            <button class="btn primary" id="btnNew">开始</button>
            <button class="btn" id="btnContinue" hidden>继续</button>
            <button class="btn" id="btnGallery">结局图鉴</button>
        </div>
    </section>

    <section class="overlay" id="menu">
        <div class="card">
            <h2>菜单</h2>
            <div class="label">文字速度</div>
            <div class="speed" id="speed">
                <button data-v="25">慢</button>
                <button data-v="50">中</button>
                <button data-v="110">快</button>
                <button data-v="0">瞬间</button>
            </div>
            <div class="label">进度会自动保存在这台设备上。</div>
            <button class="btn primary" id="btnResume">回到故事</button>
            <button class="btn" id="btnGallery2">结局图鉴</button>
            <button class="btn" id="btnRestart">从头再来</button>
            <button class="btn" id="btnToTitle">回到标题</button>
        </div>
    </section>

    <section class="overlay" id="gallery">
        <div class="card">
            <h2>结局图鉴 <small id="galleryCount" style="font-size:13px;color:var(--ink-faint)"></small></h2>
            <ul class="end-list" id="endList"></ul>
            <button class="btn" id="btnCloseGallery">关闭</button>
        </div>
    </section>

    <script src="story.js"></script>
    <script src="game.js"></script>
</body>
</html>
