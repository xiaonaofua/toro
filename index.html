<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>放水燈</title>
    <meta name="description" content="3D 互動放水燈：寫下心願，讓水燈隨水流漂向遠方">
    <link rel="icon" href="data:,">
    <style>
        :root {
            --ink: #f6ead7;
            --ink-dim: rgba(246, 234, 215, 0.62);
            --glass: rgba(10, 16, 32, 0.52);
            --glass-strong: rgba(10, 16, 32, 0.82);
            --line: rgba(255, 214, 160, 0.22);
            --amber: #ffb766;
            --amber-deep: #e88a3a;
            --serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "PMingLiU", "Hiragino Mincho ProN", serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #050913;
            color: var(--ink);
            font-family: var(--serif);
            -webkit-tap-highlight-color: transparent;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }

        body.placing #scene { cursor: crosshair; }
        body.hovering #scene { cursor: pointer; }

        /* 標題 */
        #title {
            position: fixed;
            top: max(18px, env(safe-area-inset-top));
            left: 22px;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }
        #title h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.3em;
        }
        #title p {
            margin: 6px 0 0;
            font-size: 13px;
            letter-spacing: 0.15em;
            color: var(--ink-dim);
        }

        /* 底部操作 */
        #dock {
            position: fixed;
            left: 50%;
            bottom: max(26px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: opacity 0.4s, transform 0.4s;
        }
        body.placing #dock, body.writing #dock {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 12px);
        }

        #releaseBtn {
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 0.25em;
            color: #2b1606;
            background: linear-gradient(180deg, #ffd79a, var(--amber));
            border: none;
            border-radius: 999px;
            padding: 13px 30px 13px 34px;
            cursor: pointer;
            box-shadow: 0 0 28px rgba(255, 170, 80, 0.45), 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #releaseBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 40px rgba(255, 170, 80, 0.6), 0 8px 22px rgba(0, 0, 0, 0.4);
        }

        #count {
            font-size: 12px;
            letter-spacing: 0.15em;
            color: var(--ink-dim);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }

        /* 放置提示 */
        #placeHint {
            position: fixed;
            left: 50%;
            bottom: max(30px, env(safe-area-inset-bottom));
            transform: translate(-50%, 12px);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px 10px 22px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 14px;
            letter-spacing: 0.12em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s;
        }
        body.placing #placeHint {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, 0);
        }

        .ghost-btn {
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.1em;
            color: var(--ink);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
        }
        .ghost-btn:hover { background: rgba(255, 255, 255, 0.06); }

        /* 寫心願 */
        #wishForm {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(3, 6, 14, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        body.writing #wishForm {
            opacity: 1;
            pointer-events: auto;
        }
        #wishForm form {
            width: min(380px, 100%);
            padding: 26px 24px 20px;
            border-radius: 18px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        #wishForm h2 {
            margin: 0 0 6px;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 0.2em;
        }
        #wishForm p {
            margin: 0 0 16px;
            font-size: 13px;
            color: var(--ink-dim);
            letter-spacing: 0.06em;
        }
        #wishInput {
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            outline: none;
        }
        #wishInput:focus { border-color: rgba(255, 190, 120, 0.6); }
        #wishForm .row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        #wishForm .primary {
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 0.12em;
            color: #2b1606;
            background: linear-gradient(180deg, #ffd79a, var(--amber));
            border: none;
            border-radius: 999px;
            padding: 8px 18px;
            cursor: pointer;
        }

        /* 心願卡片 */
        #wishCard {
            position: fixed;
            left: 0;
            top: 0;
            max-width: 240px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            will-change: transform;
        }
        #wishCard.show { opacity: 1; }
        #wishCard .no {
            font-size: 11px;
            letter-spacing: 0.2em;
            color: var(--amber);
            margin-bottom: 4px;
        }
        #wishCard .msg {
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: 0.05em;
            word-break: break-word;
        }

        /* 提示訊息 */
        #toast {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translate(-50%, 8px);
            padding: 10px 22px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 14px;
            letter-spacing: 0.15em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s, transform 0.6s;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* 載入畫面 */
        #loader {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #050913;
            transition: opacity 1.4s ease;
            z-index: 10;
        }
        #loader.done {
            opacity: 0;
            pointer-events: none;
        }
        #loader .flame {
            width: 14px;
            height: 22px;
            margin: 0 auto 18px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(circle at 50% 70%, #fff3c4, #ffb766 45%, rgba(232, 138, 58, 0) 72%);
            box-shadow: 0 0 30px 10px rgba(255, 170, 80, 0.35);
            animation: flicker 1.6s ease-in-out infinite;
        }
        #loader span {
            font-size: 14px;
            letter-spacing: 0.4em;
            color: var(--ink-dim);
        }
        @keyframes flicker {
            0%, 100% { transform: scale(1, 1); opacity: 1; }
            40% { transform: scale(0.92, 1.06); opacity: 0.85; }
            70% { transform: scale(1.04, 0.96); opacity: 0.95; }
        }

        @media (max-width: 600px) {
            #title h1 { font-size: 22px; }
            #title { left: 16px; }
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="scene"></canvas>

    <header id="title">
        <h1>放水燈</h1>
        <p>把心願交給水流</p>
    </header>

    <div id="dock">
        <button id="releaseBtn" type="button">放一盞水燈</button>
        <div id="count"></div>
    </div>

    <div id="placeHint">
        <span>輕點水面，放下水燈</span>
        <button class="ghost-btn" id="cancelPlaceBtn" type="button">取消</button>
    </div>

    <div id="wishForm">
        <form id="wishFormInner" autocomplete="off">
            <h2>寫下心願</h2>
            <p>水燈會帶著它，慢慢漂向遠方。</p>
            <input id="wishInput" type="text" maxlength="100" placeholder="願⋯⋯" required>
            <div class="row">
                <button class="ghost-btn" id="cancelWishBtn" type="button">取消</button>
                <button class="primary" type="submit">點亮水燈</button>
            </div>
        </form>
    </div>

    <div id="wishCard">
        <div class="no"></div>
        <div class="msg"></div>
    </div>

    <div id="toast"></div>

    <div id="loader">
        <div>
            <div class="flame"></div>
            <span>點燈中</span>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
